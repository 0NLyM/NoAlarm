name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica i segreti di firma
        env:
          KEYSTORE: ${{ secrets.NOALARM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Manca il segreto NOALARM_KEYSTORE_BASE64."
            echo "Aggiungi in Settings > Secrets and variables > Actions:"
            echo "  NOALARM_KEYSTORE_BASE64, NOALARM_STORE_PASSWORD, NOALARM_KEY_ALIAS, NOALARM_KEY_PASSWORD"
            echo "Senza la stessa chiave gli aggiornamenti futuri non si installerebbero sopra questa release."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ricostruisci il keystore
        env:
          KEYSTORE: ${{ secrets.NOALARM_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > noalarm-release.jks

      - name: Build firmato
        env:
          NOALARM_STORE_FILE: noalarm-release.jks
          NOALARM_STORE_PASSWORD: ${{ secrets.NOALARM_STORE_PASSWORD }}
          NOALARM_KEY_ALIAS: ${{ secrets.NOALARM_KEY_ALIAS }}
          NOALARM_KEY_PASSWORD: ${{ secrets.NOALARM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verifica la firma
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rinomina gli artefatti
        run: |
          V="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk "NoAlarm-$V.apk"
          mv app/build/outputs/bundle/release/app-release.aab "NoAlarm-$V.aab"

      - name: Pulisci il keystore
        if: always()
        run: rm -f noalarm-release.jks

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            NoAlarm-*.apk
            NoAlarm-*.aab
          generate_release_notes: true
